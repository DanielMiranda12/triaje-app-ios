workflows:
  ios-workflow:
    name: Compilar IPA iOS Triaje
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: |
          flutter pub get
      - name: Construir IPA para iOS
        script: |
          flutter build ipa --debug --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
