workflows:
  ios-workflow:
    name: Compilar IPA iOS Triaje
    max_build_duration: 30
    instance_type: mac_mini_m1
    working_directory: appAndroid
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: |
          flutter pub get
      - name: Construir app para iOS (Sin firma estricta)
        script: |
          flutter build ios --debug --no-codesign
    artifacts:
      - appAndroid/build/ios/iphoneos/*.app
      - build/ios/iphoneos/*.app
      - appAndroid/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
