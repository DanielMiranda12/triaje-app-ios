workflows:
  ios-workflow:
    name: Compilar IPA iOS Triaje
    max_build_duration: 30
    instance_type: mac_mini_m1
    working_directory: appAndroid
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: |
          flutter pub get
      - name: Construir IPA para iOS
        script: |
          flutter build ipa --debug --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - appAndroid/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
